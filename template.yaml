  # ══════════════════════════════════════════════════════════════════════════════
  # PMS INFRASTRUCTURE STACKS (non-Lambda resources only)
  # ══════════════════════════════════════════════════════════════════════════════

  # ── PMS staff API ──
  # Cognito user pool authorizer; every route requires a staff JWT.
  PmsApiRest:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub "anycompany-pms-rest-${Environment}"
      StageName: !Ref Environment
      TracingEnabled: true
      AccessLogSetting:
        DestinationArn: !GetAtt PmsApiAccessLogGroup.Arn
        Format: '{"requestId":"$context.requestId","ip":"$context.identity.sourceIp","method":"$context.httpMethod","path":"$context.resourcePath","status":"$context.status","protocol":"$context.protocol","responseLength":"$context.responseLength"}'
      EndpointConfiguration:
        Type: REGIONAL
      Cors:
        AllowOrigin: !If [IsNonProd, "'*'", !Sub "'https://${PmsCloudFrontDistribution.DomainName}'"]
        AllowHeaders: "'Authorization,Content-Type,X-Property-Id,X-Correlation-Id'"
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
      Auth:
        DefaultAuthorizer: CognitoUserPoolAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoUserPoolAuthorizer:
            UserPoolArn: !GetAtt AuthStack.Outputs.UserPoolArn
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          ThrottlingBurstLimit: 1000
          ThrottlingRateLimit: 500
      # Gateway request-body validation.
      # Inlined Draft 4 schemas from src/api_schemas/ (source + unit-tested
      # there; these are the deployed copies). Keep in sync.
      Models:
        StayCheckin: {"$schema":"http://json-schema.org/draft-04/schema#","type":"object","additionalProperties":false,"properties":{"roomId":{"type":"string"},"notes":{"type":"string","maxLength":2000}}}
        StayCheckout: {"$schema":"http://json-schema.org/draft-04/schema#","type":"object","additionalProperties":false,"properties":{"expressCheckout":{"type":"boolean"}}}
        StayRoomChange: {"$schema":"http://json-schema.org/draft-04/schema#","type":"object","additionalProperties":false,"required":["newRoomId"],"properties":{"newRoomId":{"type":"string","minLength":1},"reason":{"type":"string","maxLength":500}}}
        StayAssignRoom: {"$schema":"http://json-schema.org/draft-04/schema#","type":"object","additionalProperties":false,"required":["roomId"],"properties":{"roomId":{"type":"string","minLength":1}}}
        HousekeepingAssignTask: {"$schema":"http://json-schema.org/draft-04/schema#","type":"object","additionalProperties":false,"required":["assignedTo"],"properties":{"assignedTo":{"type":"string","minLength":1,"maxLength":100}}}
        HousekeepingCompleteTask: {"$schema":"http://json-schema.org/draft-04/schema#","type":"object","additionalProperties":false,"properties":{"notes":{"type":"string","maxLength":2000}}}
        HousekeepingInspectTask: {"$schema":"http://json-schema.org/draft-04/schema#","type":"object","additionalProperties":false,"required":["passed"],"properties":{"passed":{"type":"boolean"},"notes":{"type":"string","maxLength":2000}}}
        BillingPostCharge: {"$schema":"http://json-schema.org/draft-04/schema#","type":"object","additionalProperties":false,"required":["amount","description"],"properties":{"amount":{"type":"number"},"description":{"type":"string","minLength":1,"maxLength":500},"chargeType":{"type":"string"},"chargeDate":{"type":"string","pattern":"^\\d{4}-\\d{2}-\\d{2}$"}}}
        BillingVoidFolio: {"$schema":"http://json-schema.org/draft-04/schema#","type":"object","additionalProperties":false,"properties":{"reason":{"type":"string","maxLength":500}}}
        LoyaltyAdjust: {"$schema":"http://json-schema.org/draft-04/schema#","type":"object","additionalProperties":false,"required":["points","reason"],"properties":{"points":{"type":"integer"},"reason":{"type":"string","minLength":1,"maxLength":500}}}
        LoyaltyRedeem: {"$schema":"http://json-schema.org/draft-04/schema#","type":"object","additionalProperties":false,"required":["points"],"properties":{"points":{"type":"integer","minimum":1},"reservationId":{"type":"string"}}}
        AuditTrigger: {"$schema":"http://json-schema.org/draft-04/schema#","type":"object","additionalProperties":false,"properties":{"date":{"type":"string","pattern":"^\\d{4}-\\d{2}-\\d{2}$"}}}

  # ── API Gateway account-level CloudWatch role (required for REST API access
  # logging). Account-wide singleton — only one such role may be configured
  # per account. ──
  ApiGatewayCloudWatchRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonAPIGatewayPushToCloudWatchLogs

  ApiGatewayAccount:
    Type: AWS::ApiGateway::Account
    Properties:
      CloudWatchRoleArn: !GetAtt ApiGatewayCloudWatchRole.Arn

  # ── Regional WAF associations ──
  # Associate the regional WebACL with each REST API stage. The stage ARN
  # uses the apigateway service ARN form (not execute-api). SAM names the
  # implicit stage <ApiLogicalId>.Stage; we reference the API id + the
  # Environment stage name directly. DependsOn the stage so the association
  # is created only after the stage exists.
  CrsRestWebACLAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    DependsOn: AnyCompanyApiRestStage
    Properties:
      ResourceArn: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}::/restapis/${AnyCompanyApiRest}/stages/${Environment}
      WebACLArn: !GetAtt WAFRegionalStack.Outputs.RegionalWebACLArn

  PmsRestWebACLAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    DependsOn: PmsApiRestStage
    Properties:
      ResourceArn: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}::/restapis/${PmsApiRest}/stages/${Environment}
      WebACLArn: !GetAtt WAFRegionalStack.Outputs.RegionalWebACLArn

  # ── Shared Access-Log Bucket (PMS frontend + PMS CloudFront) ──
  AccessLogsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "anycompany-access-logs-${Environment}-${AWS::AccountId}"
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerPreferred
      LifecycleConfiguration:
        Rules:
          - Id: ExpireLogs
            Status: Enabled
            ExpirationInDays: 90

  AccessLogsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AccessLogsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt AccessLogsBucket.Arn
              - !Sub "${AccessLogsBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: false

  # ── PMS Frontend (S3 + CloudFront, inlined for simplicity) ──
  PmsFrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LoggingConfiguration:
        DestinationBucketName: !Ref AccessLogsBucket
        LogFilePrefix: "s3/pms-frontend/"

  PmsOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "anycompany-pms-oac-${Environment}"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  PmsCloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt PmsFrontendBucket.RegionalDomainName
            OriginAccessControlId: !Ref PmsOriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: !Ref PmsResponseHeadersPolicy
          Compress: true
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
          MinimumProtocolVersion: TLSv1.2_2021
        Logging:
          Bucket: !GetAtt AccessLogsBucket.RegionalDomainName
          Prefix: "cloudfront/pms-frontend/"
          IncludeCookies: false
        HttpVersion: http2and3
        WebACLId: !If [DeployCloudFrontWaf, !GetAtt WAFStack.Outputs.WebACLArn, !Ref "AWS::NoValue"]

  PmsFrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref PmsFrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${PmsFrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${PmsCloudFrontDistribution}"
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt PmsFrontendBucket.Arn
              - !Sub "${PmsFrontendBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: false

  # Security headers for the PMS SPA. Same strict enforced baseline as the CRS
  # distribution. CSP is REPORT-ONLY first (promote to enforced after in-browser
  # validation). The PMS frontend does NOT use Stripe, so its CSP is tighter than
  # the CRS one — no js.stripe.com/api.stripe.com/Stripe iframes. connect-src
  # allows only the app's own API Gateway + Cognito over HTTPS.
  PmsResponseHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub anycompany-pms-security-headers-${Environment}
        Comment: Strict baseline (enforced) + CSP (report-only) for the PMS SPA
        SecurityHeadersConfig:
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 63072000
            IncludeSubdomains: true
            Preload: true
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
        CustomHeadersConfig:
          Items:
            - Header: Permissions-Policy
              Value: "camera=(), microphone=(), geolocation=(), payment=()"
              Override: true
            - Header: Content-Security-Policy-Report-Only
              Value: >-
                default-src 'self';
                script-src 'self';
                style-src 'self' 'unsafe-inline';
                img-src 'self' data: https:;
                font-src 'self' data:;
                connect-src 'self' https://*.amazonaws.com;
                object-src 'none';
                base-uri 'self';
                form-action 'self';
                frame-ancestors 'none'
              Override: true

