Outputs:
  # ApiUrl / PmsApiUrl are the CRS and PMS API base URLs; consumers (tests,
  # setup scripts) read these.
  ApiUrl:
    Description: CRS API Gateway URL
    Value: !Sub "https://${AnyCompanyApiRest}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"
  PmsApiUrl:
    Description: PMS API Gateway URL
    Value: !Sub "https://${PmsApiRest}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"
  UserPoolId:
    Description: Cognito User Pool ID
    Value: !GetAtt AuthStack.Outputs.UserPoolId
  UserPoolClientId:
    Description: Cognito User Pool Client ID
    Value: !GetAtt AuthStack.Outputs.UserPoolClientId
  AdminAuthClientId:
    Description: Cognito client ID for server-side ADMIN_USER_PASSWORD_AUTH (simulator + test harnesses)
    Value: !GetAtt AuthStack.Outputs.AdminAuthClientId
  M2MClientId:
    Description: M2M Client ID for service-to-service auth
    Value: !GetAtt AuthStack.Outputs.M2MClientId
  CloudFrontUrl:
    Description: CRS Frontend CloudFront URL
    Value: !GetAtt FrontendStack.Outputs.CloudFrontUrl
  PmsCloudFrontUrl:
    Description: PMS Staff Dashboard URL
    Value: !Sub "https://${PmsCloudFrontDistribution.DomainName}"
  PmsFrontendBucketName:
    Description: PMS Frontend S3 Bucket
    Value: !Ref PmsFrontendBucket
  PmsCloudFrontDistributionId:
    Description: PMS CloudFront Distribution ID
    Value: !Ref PmsCloudFrontDistribution
  FrontendBucket:
    Description: CRS Frontend S3 Bucket
    Value: !GetAtt FrontendStack.Outputs.FrontendBucketName
  DBProxyHost:
    Description: RDS Proxy Endpoint
    Value: !GetAtt DatabaseStack.Outputs.DBProxyEndpoint
  DBClusterArn:
    Description: Aurora cluster ARN (for use with the RDS Data API)
    Value: !GetAtt DatabaseStack.Outputs.DBClusterArn
  DBSecretArn:
    Description: ARN of the database master credentials secret
    Value: !GetAtt DatabaseStack.Outputs.DBSecretArn
