  # ── Simulator service identity ──
  # The activity simulator authenticates as a dedicated Cognito user in the Admin
  # group. The password is auto-generated and stored in Secrets Manager. The user
  # is created in FORCE_CHANGE_PASSWORD state by CFN; scripts/finalize_simulator_user.py
  # promotes it to CONFIRMED post-deploy via AdminSetUserPassword.
  SimulatorCredsSecret:
    Type: AWS::SecretsManager::Secret
    Condition: DeploySimulator
    Properties:
      Name: !Sub anycompany-booking-simulator-creds-${Environment}
      Description: Username + password for the activity simulator service user
      GenerateSecretString:
        SecretStringTemplate: '{"username":"simulator@anycompanyhotels.local"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludeCharacters: '"@/\'

  SimulatorUser:
    Type: AWS::Cognito::UserPoolUser
    Condition: DeploySimulator
    Properties:
      UserPoolId: !GetAtt AuthStack.Outputs.UserPoolId
      Username: simulator@anycompanyhotels.local
      MessageAction: SUPPRESS
      UserAttributes:
        - Name: email
          Value: simulator@anycompanyhotels.local
        - Name: email_verified
          Value: "true"
        - Name: given_name
          Value: Activity
        - Name: family_name
          Value: Simulator

  SimulatorUserAdminGroup:
    Type: AWS::Cognito::UserPoolUserToGroupAttachment
    Condition: DeploySimulator
    Properties:
      UserPoolId: !GetAtt AuthStack.Outputs.UserPoolId
      Username: !Ref SimulatorUser
      GroupName: Admin

  PmsActivitySimulatorFunction:
    Type: AWS::Serverless::Function
    Condition: DeploySimulator
    Properties:
      Role: !GetAtt LambdaSimulatorRole.Arn
      FunctionName: !Sub anycompany-pms-simulator-${Environment}
      LoggingConfig:
        LogGroup: !Ref PmsActivitySimulatorFunctionLogGroup
      Handler: simulator.handler
      VpcConfig:
        SecurityGroupIds:
          - !GetAtt VPCStack.Outputs.LambdaSecurityGroupId
        SubnetIds: !Split [",", !GetAtt VPCStack.Outputs.PrivateSubnetIds]
      CodeUri: src/pms/activity_simulator/
      Timeout: 900
      MemorySize: 512
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt ScheduledFunctionsDLQ.Arn
      Layers: [!Ref CommonLayer]
      Environment:
        Variables:
          # The simulator drives synthetic load against the same API surface
          # real traffic uses, so it exercises the WAF + gateway validation too.
          CRS_API_URL: !Sub "https://${AnyCompanyApiRest}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"
          PMS_API_URL: !Sub "https://${PmsApiRest}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"
          COGNITO_USER_POOL_ID: !GetAtt AuthStack.Outputs.UserPoolId
          # Dedicated admin-auth client (not the public SPA client) for the
          # simulator's ADMIN_USER_PASSWORD_AUTH flow.
          ADMIN_AUTH_CLIENT_ID: !GetAtt AuthStack.Outputs.AdminAuthClientId
          SIMULATOR_CREDS_SECRET_ARN: !Ref SimulatorCredsSecret
          DB_PROXY_ENDPOINT: !GetAtt DatabaseStack.Outputs.DBProxyEndpoint
          DB_NAME: anycompany
          EVENT_BUS_NAME: !GetAtt EventsStack.Outputs.EventBusName
          API_PACING_MS: "50"
          # Per-run caps. Each phase is sized to keep pace with the one feeding
          # it, so work doesn't back up across runs:
          #   - check-ins >= arrivals, so booked stays don't accumulate
          #     unchecked-in;
          #   - checkouts >= check-ins, with headroom to clear stays already
          #     due, so rooms free up for new arrivals;
          #   - housekeeping ~1.3x checkouts: every checkout dirties a room, and
          #     ~15% of inspections fail and send the room back for another clean.
          # These are upper bounds; a smaller guest pool simply does less work
          # per run. All stay well under the function's 900s timeout.
          MAX_RESERVATIONS_PER_RUN: "200"
          MAX_CHECKINS_PER_RUN: "250"
          MAX_CHECKOUTS_PER_RUN: "350"
          MAX_HOUSEKEEPING_TASKS_PER_RUN: "450"
          MAX_INCIDENTAL_CHARGES_PER_RUN: "15"
          MAX_CANCELLATIONS_PER_RUN: "5"
          FORWARD_WINDOW_DAYS: "60"
          ENVIRONMENT: !Ref Environment
          POWERTOOLS_LOG_LEVEL: INFO
          POWERTOOLS_SERVICE_NAME: pms-activity-simulator
      Events:
        Schedule:
          Type: Schedule
          Properties:
            Schedule: rate(4 hours)
            Description: End-to-end activity simulation
            Enabled: true


