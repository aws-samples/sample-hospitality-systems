AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AnyCompany Hotels & Resorts - Booking Platform

Globals:
  Function:
    Runtime: python3.12
    # Graviton2 (arm64): ~20% cheaper per GB-s and typically faster init for
    # Python workloads. All bundled native deps (psycopg, cryptography) ship
    # arm64 wheels; pip resolves the right architecture at build time.
    Architectures:
      - arm64
    Timeout: 60
    MemorySize: 256
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
        DB_SECRET_ARN: !GetAtt DatabaseStack.Outputs.DBSecretArn
        DB_PROXY_ENDPOINT: !GetAtt DatabaseStack.Outputs.DBProxyEndpoint
        DB_NAME: anycompany
        EVENT_BUS_NAME: !GetAtt EventsStack.Outputs.EventBusName
        COGNITO_USER_POOL_ID: !GetAtt AuthStack.Outputs.UserPoolId
        # Client IDs used as the audience allowlist when handlers re-verify a
        # raw JWT signature. Both clients mint ID tokens that reach the APIs
        # (SPA = browser; admin-auth = simulator/tests).
        COGNITO_USER_POOL_CLIENT_ID: !GetAtt AuthStack.Outputs.UserPoolClientId
        ADMIN_AUTH_CLIENT_ID: !GetAtt AuthStack.Outputs.AdminAuthClientId

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
  StripePublishableKey:
    Type: String
    Default: pk_test_placeholder
    Description: Stripe publishable key (test mode)
  DomainName:
    Type: String
    Default: ""
    Description: Custom domain name (optional)
  DeployActivitySimulator:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >
      Deploy the scheduled activity simulator (demo-traffic generator). OFF by
      default; opt in for demo/dev environments. When false, no simulator
      function, schedule, IAM role, Cognito service user, or credentials secret
      is created.
  EnableCloudFrontWaf:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >
      Attach the CLOUDFRONT-scope WAF WebACL to the SPA distributions. ON by
      default. A CLOUDFRONT-scope WAFv2 WebACL can ONLY be created in us-east-1,
      so deployments to ANY OTHER region MUST set this to "false" or the stack
      fails with "The scope is not valid". When false, the SPA CloudFront
      distributions deploy without a WAF; the REGIONAL WAF on the REST API
      stages (the data plane) is unaffected and always deployed.
  EnableDataApi:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >
      Enable the RDS Data API (HTTP endpoint) on the Aurora cluster. OFF by
      default: the Data API is an HTTPS SQL path that runs as the master user and
      bypasses the per-function IAM-proxy access model, so anyone with rds-data
      permissions plus the cluster/secret ARNs can run arbitrary SQL. Leave it
      off for production. Turn it on only for dev/demo environments that want
      ad-hoc query access (e.g. `aws rds-data execute-statement`).

Conditions:
  # Allow Vite dev-server origins (http://localhost:5173/5174) in CORS for any
  # non-prod deployment so developers can run the SPAs locally against the
  # deployed backend. Prod deploys drop these entries entirely via AWS::NoValue.
  IsNonProd: !Not [!Equals [!Ref Environment, prod]]
  # Gate the activity simulator (function, schedule, IAM role, Cognito service
  # user, creds secret) behind an explicit opt-in. Off by default for adopters.
  DeploySimulator: !Equals [!Ref DeployActivitySimulator, "true"]
  # Gate the CLOUDFRONT-scope SPA WAF. Must be false for non-us-east-1 deploys
  # (CLOUDFRONT WebACLs only exist in us-east-1). See EnableCloudFrontWaf.
  DeployCloudFrontWaf: !Equals [!Ref EnableCloudFrontWaf, "true"]

Resources:
  # ──────────────────────────────────────────────────────────────────────────
  # Per-function IAM role catalog — each Lambda gets a least-privilege role
  # scoped to only the resources it needs (no shared catch-all role).
  # ──────────────────────────────────────────────────────────────────────────
  # Each Lambda is assigned a role tightly scoped to the AWS APIs and
  # resources it actually uses. Permissions are grouped into buckets matching
  # the handler's permission shape (audited from code).
  #
  # Strategy:
  #   1. Every role attaches AWSLambdaVPCAccessExecutionRole (managed) for
  #      logs + ENI lifecycle. AWS maintains it; one less thing to audit.
  #   2. Custom inline policies are scoped to specific resource ARNs — no
  #      account-wide wildcards. The DB Proxy ARN, event bus ARN, Stripe
  #      secret ARN, state machine ARNs, queue ARNs, and SES identity are
  #      all wired by reference.
  #
  # An earlier shared LambdaExecutionRole granted the union of every
  # permission any handler in the codebase used; most handlers received far
  # more than they needed. It was deleted once all functions migrated to the
  # role catalog below.
  # ──────────────────────────────────────────────────────────────────────────

  # Bucket 1 — Read-only DB.
  # Used by ~30 handlers that issue SELECTs only (search/get/list).
  LambdaDbReadRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub anycompany-${Environment}-lambda-db-read
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: RdsProxyConnect
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: rds-db:connect
                Resource: !Sub
                  - arn:aws:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:${ProxyId}/anycompany_admin
                  - ProxyId: !GetAtt DatabaseStack.Outputs.DBProxyResourceId

  # Migration / seed role — assumed by the short-lived Lambdas that
  # scripts/run_migration.py and the seed scripts create to run schema DDL and
  # data seeding inside the VPC, connecting through RDS Proxy as the master user
  # (anycompany_admin). Operator tooling, not an application Lambda; kept
  # separate so the per-function role catalog above stays scoped to runtime
  # handlers. The scripts look this role up by logical id (LambdaMigrationRole).
  LambdaMigrationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub anycompany-${Environment}-lambda-migration
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: RdsProxyConnect
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: rds-db:connect
                Resource: !Sub
                  - arn:aws:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:${ProxyId}/anycompany_admin
                  - ProxyId: !GetAtt DatabaseStack.Outputs.DBProxyResourceId

  # Bucket 2 — DB + EventBridge writes.
  # Used by ~17 handlers that emit reservation/billing/loyalty/etc events.
  LambdaDbWriteEventRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub anycompany-${Environment}-lambda-db-write-event
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: RdsProxyConnect
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: rds-db:connect
                Resource: !Sub
                  - arn:aws:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:${ProxyId}/anycompany_admin
                  - ProxyId: !GetAtt DatabaseStack.Outputs.DBProxyResourceId
        - PolicyName: EventBridgePut
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: events:PutEvents
                Resource: !GetAtt EventsStack.Outputs.EventBusArn
        # The scheduled night-audit worker (which uses this role) sends
        # invocations that still fail after Lambda's async retries here.
        - PolicyName: ScheduledFunctionsDlqSend
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt ScheduledFunctionsDLQ.Arn

  # Bucket 3 — DB + EventBridge + Stripe secret read.
  # Used by 7 Stripe-aware handlers (cart, payment intent, refund, webhook).
  # The Stripe secret ARN is the ONLY secret these Lambdas can read; the DB
  # master credential and simulator credentials remain inaccessible.
  LambdaDbWriteStripeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub anycompany-${Environment}-lambda-db-write-stripe
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: RdsProxyConnect
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: rds-db:connect
                Resource: !Sub
                  - arn:aws:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:${ProxyId}/anycompany_admin
                  - ProxyId: !GetAtt DatabaseStack.Outputs.DBProxyResourceId
        - PolicyName: EventBridgePut
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: events:PutEvents
                Resource: !GetAtt EventsStack.Outputs.EventBusArn
        - PolicyName: StripeSecretRead
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:anycompany-booking-stripe-${Environment}*

  # Bucket 3b — DB + Stripe secret read, NO event publishing.
  # Used by the 3 Stripe-aware handlers that don't emit EventBridge events:
  # create-payment-intent, create-payment-method, stripe-webhook. Identical
  # to LambdaDbWriteStripeRole minus the events:PutEvents grant.
  LambdaDbStripeNoEventsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub anycompany-${Environment}-lambda-db-stripe-no-events
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: RdsProxyConnect
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: rds-db:connect
                Resource: !Sub
                  - arn:aws:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:${ProxyId}/anycompany_admin
                  - ProxyId: !GetAtt DatabaseStack.Outputs.DBProxyResourceId
        - PolicyName: StripeSecretRead
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:anycompany-booking-stripe-${Environment}*

  # Bucket 4 — DB + EventBridge + Step Functions task tokens.
  # Used by 5 handlers that complete or fail SFN tasks (check-in, check-out,
  # billing event consumer, housekeeping event consumer, inspect_task). They
  # do NOT need StartExecution — executions are started by EventBridge rules.
  LambdaSfnTaskTargetRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub anycompany-${Environment}-lambda-sfn-task
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: RdsProxyConnect
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: rds-db:connect
                Resource: !Sub
                  - arn:aws:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:${ProxyId}/anycompany_admin
                  - ProxyId: !GetAtt DatabaseStack.Outputs.DBProxyResourceId
        - PolicyName: EventBridgePut
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: events:PutEvents
                Resource: !GetAtt EventsStack.Outputs.EventBusArn
        - PolicyName: StepFunctionsTaskTokens
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - states:SendTaskSuccess
                  - states:SendTaskFailure
                # Task-token actions are unscoped on the state machine — AWS
                # accepts any active task token regardless of which state
                # machine issued it. Resource: "*" matches AWS guidance.
                Resource: "*"

  # Bucket 4b — DB + Step Functions task tokens, NO event publishing.
  # Used by the 2 SFN task targets that don't emit EventBridge events:
  # complete_task, inspect_task. Identical to LambdaSfnTaskTargetRole
  # minus the events:PutEvents grant.
  LambdaSfnTaskOnlyRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub anycompany-${Environment}-lambda-sfn-task-only
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: RdsProxyConnect
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: rds-db:connect
                Resource: !Sub
                  - arn:aws:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:${ProxyId}/anycompany_admin
                  - ProxyId: !GetAtt DatabaseStack.Outputs.DBProxyResourceId
        - PolicyName: StepFunctionsTaskTokens
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - states:SendTaskSuccess
                  - states:SendTaskFailure
                Resource: "*"

  # Bucket 5a — SQS consumer for the housekeeping queue.
  # One role per queue, scoped to that queue's ARN only.
  LambdaSqsHousekeepingConsumerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub anycompany-${Environment}-lambda-sqs-housekeeping
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: RdsProxyConnect
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: rds-db:connect
                Resource: !Sub
                  - arn:aws:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:${ProxyId}/anycompany_admin
                  - ProxyId: !GetAtt DatabaseStack.Outputs.DBProxyResourceId
        - PolicyName: EventBridgePut
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: events:PutEvents
                Resource: !GetAtt EventsStack.Outputs.EventBusArn
        - PolicyName: SqsConsume
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                  - sqs:ChangeMessageVisibility
                Resource: !GetAtt EventsStack.Outputs.PmsHousekeepingQueueArn
        - PolicyName: StartHousekeepingDispatch
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: states:StartExecution
                Resource: !Ref HousekeepingDispatchStateMachine

  # Bucket 5b — SQS consumer for the billing queue.
  LambdaSqsBillingConsumerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub anycompany-${Environment}-lambda-sqs-billing
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: RdsProxyConnect
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: rds-db:connect
                Resource: !Sub
                  - arn:aws:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:${ProxyId}/anycompany_admin
                  - ProxyId: !GetAtt DatabaseStack.Outputs.DBProxyResourceId
        - PolicyName: EventBridgePut
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: events:PutEvents
                Resource: !GetAtt EventsStack.Outputs.EventBusArn
        - PolicyName: SqsConsume
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                  - sqs:ChangeMessageVisibility
                Resource: !GetAtt EventsStack.Outputs.PmsBillingQueueArn
        - PolicyName: StartCheckoutBilling
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: states:StartExecution
                Resource: !Ref CheckoutBillingStateMachine

  # Bucket 5c — SQS consumer for the loyalty queue.
  LambdaSqsLoyaltyConsumerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub anycompany-${Environment}-lambda-sqs-loyalty
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: RdsProxyConnect
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: rds-db:connect
                Resource: !Sub
                  - arn:aws:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:${ProxyId}/anycompany_admin
                  - ProxyId: !GetAtt DatabaseStack.Outputs.DBProxyResourceId
        - PolicyName: EventBridgePut
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: events:PutEvents
                Resource: !GetAtt EventsStack.Outputs.EventBusArn
        - PolicyName: SqsConsume
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                  - sqs:ChangeMessageVisibility
                Resource: !GetAtt EventsStack.Outputs.PmsLoyaltyQueueArn

  # Bucket 6 — DB read + SES send.
  # Used by the notifications consumer only. Scoped to the verified-domain
  # SES identity that is the From address. SES ses:SendEmail / SendRawEmail
  # are scoped via the ses:FromAddress condition AND the identity ARN.
  LambdaNotificationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub anycompany-${Environment}-lambda-notification
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: RdsProxyConnect
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: rds-db:connect
                Resource: !Sub
                  - arn:aws:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:${ProxyId}/anycompany_admin
                  - ProxyId: !GetAtt DatabaseStack.Outputs.DBProxyResourceId
        - PolicyName: SqsConsume
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                  - sqs:ChangeMessageVisibility
                Resource: !GetAtt EventsStack.Outputs.PmsNotificationsQueueArn
        - PolicyName: SesSend
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                # Identity ARN is scoped to the From address. SES requires
                # the principal to control the verified identity that
                # appears in the Source header.
                Resource: !Sub arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/anycompanyhotels.com
                Condition:
                  StringEquals:
                    ses:FromAddress: noreply@anycompanyhotels.com

  # Bucket 7 — Activity simulator only.
  # The simulator authenticates as a dedicated Cognito user via
  # AdminInitiateAuth, then drives the public CRS + PMS APIs. Its IAM role
  # only needs cognito-idp:AdminInitiateAuth on the user pool, and read
  # access to its own credentials secret.
  LambdaSimulatorRole:
    Type: AWS::IAM::Role
    Condition: DeploySimulator
    Properties:
      RoleName: !Sub anycompany-${Environment}-lambda-simulator
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: RdsProxyConnect
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: rds-db:connect
                Resource: !Sub
                  - arn:aws:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:${ProxyId}/anycompany_admin
                  - ProxyId: !GetAtt DatabaseStack.Outputs.DBProxyResourceId
        - PolicyName: SimulatorCredsRead
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:anycompany-booking-simulator-creds-${Environment}*
        - PolicyName: CognitoAdminInitiateAuth
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: cognito-idp:AdminInitiateAuth
                Resource: !GetAtt AuthStack.Outputs.UserPoolArn
        - PolicyName: ScheduledFunctionsDlqSend
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt ScheduledFunctionsDLQ.Arn

  # Dead-letter queue for the scheduled (asynchronously invoked) functions:
  # the night-audit worker and the activity simulator. When a scheduled run
  # still fails after Lambda's built-in async retries, the event is kept here
  # for 14 days instead of being dropped. Functions invoked synchronously (API
  # Gateway, Step Functions) or through SQS event sources don't use a function
  # DLQ: their callers handle retries, and the SQS queues have their own DLQs.
  ScheduledFunctionsDLQ:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600  # 14 days
      SqsManagedSseEnabled: true
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # ── Infrastructure Stacks ──
  VPCStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: stacks/vpc.yaml
      Parameters:
        Environment: !Ref Environment

  DatabaseStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: stacks/database.yaml
      Parameters:
        Environment: !Ref Environment
        VpcId: !GetAtt VPCStack.Outputs.VpcId
        PrivateSubnetIds: !GetAtt VPCStack.Outputs.PrivateSubnetIds
        LambdaSecurityGroupId: !GetAtt VPCStack.Outputs.LambdaSecurityGroupId
        EnableDataApi: !Ref EnableDataApi

  AuthStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: stacks/auth.yaml
      Parameters:
        Environment: !Ref Environment

  EventsStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: stacks/events.yaml
      Parameters:
        Environment: !Ref Environment

  # CLOUDFRONT-scope WAF for the SPA distributions. Conditional: a CLOUDFRONT
  # WebACL can only be created in us-east-1, so this is skipped (and the
  # distributions deploy without it) when EnableCloudFrontWaf=false — required
  # for any non-us-east-1 deployment.
  WAFStack:
    Type: AWS::CloudFormation::Stack
    Condition: DeployCloudFrontWaf
    Properties:
      TemplateURL: stacks/waf.yaml
      Parameters:
        Environment: !Ref Environment

  # Regional WAF for the REST API Gateways. Separate from WAFStack because
  # WAFv2 scope is immutable: that one is CLOUDFRONT (frontends), this one is
  # REGIONAL (the REST API stages).
  WAFRegionalStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: stacks/waf-regional.yaml
      Parameters:
        Environment: !Ref Environment

  FrontendStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: stacks/frontend.yaml
      Parameters:
        Environment: !Ref Environment
        DomainName: !Ref DomainName
        # Empty string when the CloudFront WAF is disabled; frontend.yaml maps an
        # empty value to AWS::NoValue so the distribution deploys without a WebACL.
        WAFWebACLArn: !If [DeployCloudFrontWaf, !GetAtt WAFStack.Outputs.WebACLArn, ""]

  # ── Common Layer ──
  CommonLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub anycompany-common-${Environment}
      Description: Shared utilities for AnyCompany Booking
      ContentUri: src/layers/common/
      CompatibleRuntimes:
        - python3.12
      CompatibleArchitectures:
        - arm64
      RetentionPolicy: Delete
    Metadata:
      BuildMethod: python3.12
      BuildArchitecture: arm64

  # ── API Gateway ──
  # Access-log destinations for the REST API stages (CloudWatch).
  CrsApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/apigateway/anycompany-crs-${Environment}
      RetentionInDays: 30
  PmsApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/apigateway/anycompany-pms-${Environment}
      RetentionInDays: 30

  # CRS guest-facing API. Cognito user pool authorizer; public routes (browse,
  # search, cart, Stripe webhook) carry Authorizer: NONE.
  AnyCompanyApiRest:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub "anycompany-crs-rest-${Environment}"
      StageName: !Ref Environment
      TracingEnabled: true
      AccessLogSetting:
        DestinationArn: !GetAtt CrsApiAccessLogGroup.Arn
        Format: '{"requestId":"$context.requestId","ip":"$context.identity.sourceIp","method":"$context.httpMethod","path":"$context.resourcePath","status":"$context.status","protocol":"$context.protocol","responseLength":"$context.responseLength"}'
      EndpointConfiguration:
        Type: REGIONAL
      # Stripe webhooks POST a signed raw body. REST proxy integration already
      # passes the body through verbatim as a string (the webhook handler reads
      # event["body"] directly, with no base64 decode), so JSON must NOT be
      # declared binary — doing so makes API Gateway base64-encode every JSON
      # POST body and breaks handlers that json.loads(event["body"]).
      # octet-stream documents the raw-body intent but never matches Stripe's
      # application/json content-type, so it's an effective no-op.
      BinaryMediaTypes:
        - "application/octet-stream"
      Cors:
        AllowOrigin: !If [IsNonProd, "'*'", !Sub "'https://${PmsCloudFrontDistribution.DomainName}'"]
        AllowHeaders: "'Authorization,Content-Type,X-Property-Id,X-Correlation-Id'"
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
      Auth:
        DefaultAuthorizer: CognitoUserPoolAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoUserPoolAuthorizer:
            UserPoolArn: !GetAtt AuthStack.Outputs.UserPoolArn
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          ThrottlingBurstLimit: 1000
          ThrottlingRateLimit: 500
      # Gateway request-body validation.
      # JSON Schema (Draft 4) models inlined from src/api_schemas/. The
      # src files are the human-edited source + unit-tested in
      # tests/unit/api_schemas/; these inline copies are the deployed form
      # (SAM Models need inline schema, not file refs, without OpenAPI).
      # Keep them in sync if a schema changes.
      Models:
        ReservationCreate: {"$schema":"http://json-schema.org/draft-04/schema#","type":"object","additionalProperties":false,"required":["propertyId","roomTypeId","ratePlanId","checkInDate","checkOutDate","adults"],"properties":{"propertyId":{"type":"string","minLength":1},"roomTypeId":{"type":"string","minLength":1},"ratePlanId":{"type":"string","minLength":1},"checkInDate":{"type":"string","pattern":"^\\d{4}-\\d{2}-\\d{2}$"},"checkOutDate":{"type":"string","pattern":"^\\d{4}-\\d{2}-\\d{2}$"},"adults":{"type":"integer","minimum":1,"maximum":8},"children":{"type":"integer","minimum":0,"maximum":8},"paymentMethodId":{"type":"string"},"additionalNotes":{"type":"string","maxLength":2000},"guestInfo":{"type":"object"}}}
        ReservationUpdate: {"$schema":"http://json-schema.org/draft-04/schema#","type":"object","additionalProperties":false,"properties":{"checkInDate":{"type":"string","pattern":"^\\d{4}-\\d{2}-\\d{2}$"},"checkOutDate":{"type":"string","pattern":"^\\d{4}-\\d{2}-\\d{2}$"},"adults":{"type":"integer","minimum":1,"maximum":8},"children":{"type":"integer","minimum":0,"maximum":8},"additionalNotes":{"type":"string","maxLength":2000}}}
        GuestCreate: {"$schema":"http://json-schema.org/draft-04/schema#","type":"object","additionalProperties":false,"required":["firstName","lastName","email"],"properties":{"firstName":{"type":"string","minLength":1,"maxLength":100},"lastName":{"type":"string","minLength":1,"maxLength":100},"email":{"type":"string","minLength":3,"maxLength":254},"phone":{"type":"string","maxLength":32},"dateOfBirth":{"type":"string","pattern":"^\\d{4}-\\d{2}-\\d{2}$"},"preferences":{"type":"object"},"commPrefs":{"type":"object"}}}
        GuestUpdate: {"$schema":"http://json-schema.org/draft-04/schema#","type":"object","additionalProperties":false,"properties":{"firstName":{"type":"string","minLength":1,"maxLength":100},"lastName":{"type":"string","minLength":1,"maxLength":100},"phone":{"type":"string","maxLength":32},"dateOfBirth":{"type":"string","pattern":"^\\d{4}-\\d{2}-\\d{2}$"},"nationality":{"type":"string","maxLength":64},"language":{"type":"string","maxLength":16},"addressLine1":{"type":"string","maxLength":200},"addressLine2":{"type":"string","maxLength":200},"city":{"type":"string","maxLength":100},"state":{"type":"string","maxLength":100},"postalCode":{"type":"string","maxLength":20},"country":{"type":"string","maxLength":64},"preferences":{"type":"object"},"commPrefs":{"type":"object"}}}
        PaymentCreateIntent: {"$schema":"http://json-schema.org/draft-04/schema#","type":"object","additionalProperties":false,"required":["amount","guestId"],"properties":{"amount":{"type":"number","minimum":0,"exclusiveMinimum":true},"guestId":{"type":"string","minLength":1},"currency":{"type":"string","minLength":3,"maxLength":3},"reservationId":{"type":"string"}}}
        PaymentConfirm: {"$schema":"http://json-schema.org/draft-04/schema#","type":"object","additionalProperties":false,"required":["paymentIntentId","authorizationId"],"properties":{"paymentIntentId":{"type":"string","minLength":1},"authorizationId":{"type":"string","minLength":1}}}
        PaymentRefund: {"$schema":"http://json-schema.org/draft-04/schema#","type":"object","additionalProperties":false,"required":["reason"],"properties":{"reason":{"type":"string","minLength":1,"maxLength":500},"amount":{"type":"number","minimum":0,"exclusiveMinimum":true}}}
        PaymentMethodCreate: {"$schema":"http://json-schema.org/draft-04/schema#","type":"object","additionalProperties":false,"required":["stripePaymentMethodId"],"properties":{"stripePaymentMethodId":{"type":"string","minLength":1}}}
        BookingCreateCart: {"$schema":"http://json-schema.org/draft-04/schema#","type":"object","additionalProperties":false,"required":["propertyId","roomTypeId","ratePlanId","checkIn","checkOut","sessionId"],"properties":{"propertyId":{"type":"string","minLength":1},"roomTypeId":{"type":"string","minLength":1},"ratePlanId":{"type":"string","minLength":1},"checkIn":{"type":"string","pattern":"^\\d{4}-\\d{2}-\\d{2}$"},"checkOut":{"type":"string","pattern":"^\\d{4}-\\d{2}-\\d{2}$"},"sessionId":{"type":"string","minLength":1,"maxLength":256},"adults":{"type":"integer","minimum":1,"maximum":8},"children":{"type":"integer","minimum":0,"maximum":8}}}
        BookingUpdateCart: {"$schema":"http://json-schema.org/draft-04/schema#","type":"object","additionalProperties":false,"properties":{"roomTypeId":{"type":"string","minLength":1},"ratePlanId":{"type":"string","minLength":1},"checkIn":{"type":"string","pattern":"^\\d{4}-\\d{2}-\\d{2}$"},"checkOut":{"type":"string","pattern":"^\\d{4}-\\d{2}-\\d{2}$"},"adults":{"type":"integer","minimum":1,"maximum":8},"children":{"type":"integer","minimum":0,"maximum":8}}}
        BookingApplyPromo: {"$schema":"http://json-schema.org/draft-04/schema#","type":"object","additionalProperties":false,"required":["promoCode"],"properties":{"promoCode":{"type":"string","minLength":1,"maxLength":64}}}
        BookingComplete: {"$schema":"http://json-schema.org/draft-04/schema#","type":"object","additionalProperties":false,"required":["guestId","paymentMethodId"],"properties":{"guestId":{"type":"string","minLength":1},"paymentMethodId":{"type":"string","minLength":1},"specialRequests":{"type":"string","maxLength":2000},"guests":{"type":"array","items":{"type":"object","properties":{"firstName":{"type":"string"},"lastName":{"type":"string"},"email":{"type":"string"}}}}}}
        StripeWebhook: {"$schema":"http://json-schema.org/draft-04/schema#","type":"object","required":["type"],"properties":{"type":{"type":"string"},"id":{"type":"string"},"data":{"type":"object"}}}

