  AnalyticsStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: stacks/analytics.yaml
      Parameters:
        Environment: !Ref Environment
        EventBusName: !GetAtt EventsStack.Outputs.EventBusName
